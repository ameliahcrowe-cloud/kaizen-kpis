name: Orexis weekly scorecards
on:
  schedule:
    - cron: '0 21 * * 6'   # Sun 8am Sydney (AEDT)
    - cron: '0 22 * * 6'   # Sun 8am Sydney (AEST)
  workflow_dispatch:
    inputs:
      test:
        description: 'Send to Ameliah only'
        default: 'true'
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Only at 8am Sydney
        id: t
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Australia/Sydney date +%H)" != "08" ]; then echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.t.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.t.outputs.go == 'yes'
        with: { node-version: 20 }
      - name: Render and send
        if: steps.t.outputs.go == 'yes'
        env:
          KEY: ${{ secrets.CARDS_KEY }}
          EXEC: https://script.google.com/macros/s/AKfycbyriI5naP0q1cUQ3PR4q_YwNZLBZ2ybO7jzGIp7QTX1kN9wu5tTasokUHN07eGdRttvfw/exec
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test == 'true' }}
        run: |
          sudo apt-get install -y -q fonts-noto-color-emoji >/dev/null
          npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          curl -sSL "$EXEC?app=cards&key=$KEY" -o cards.json
          node tools/render-cards.js cards.json out
          python3 -c "import json,os;p=json.load(open('out/payload.json'));p['key']=os.environ['KEY'];p['test']=os.environ['TEST']=='true';json.dump(p,open('post.json','w'))"
          curl -sSL -X POST -H 'Content-Type: application/json' --data @post.json "$EXEC"
