/* Palette: maroon, black and white (zone and status colours unchanged). Layout: scoreboard header with a date stepper, tabs below; leader sees the team, each rep sees only their own numbers */
:root{
  --bg:#f6f4f4; --panel:#ffffff; --ink:#111111; --muted:#5f5759; --line:#e2dcdd;
  --accent:#424965; --accent-ink:#ffffff; --accent-soft:#efe0cf;
  --ok:#17844f; --warn:#b86e00; --bad:#c23a2b; --pb:#c8540f;
  --m-red:#c23a2b; --m-silver:#8a96a3; --m-gold:#c89412; --m-plat:#5b8fa8; --m-dia:#6a4fd6;
  color-scheme:light;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
#teamLogo{width:56px;height:56px;object-fit:contain;border-radius:10px;flex:none}
.logorow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logoprev{width:72px;height:72px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.logoprev.empty{display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted)}
.brand h1{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stepper input[type=date]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.weeklabel{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);width:100%;text-align:right}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.45;cursor:default}
button.icon{padding:7px 10px;line-height:1}
#daybar{display:none}
@media (max-width:720px){
  #daybar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 0 10px}
  #daybar button{min-width:44px;min-height:44px;font-size:1.2rem;font-weight:700}
  #daybar .dl{flex:1;text-align:center;font-weight:700}
  #daybar .dl small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
  .formfoot{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));background:var(--panel);z-index:5;box-shadow:0 -6px 12px rgba(0,0,0,.05);border-radius:0 0 12px 12px}
  input.num,input[type=number],input[type=text],input[type=date],select,textarea{font-size:16px;min-height:44px}
  .form label{font-size:.9rem}
  .form input.num{font-size:1.15rem;font-weight:600;text-align:center}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards thead{display:none}
  table.cards tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:8px 12px;background:var(--panel)}
  table.cards tr.total{border-color:var(--accent)}
  table.cards td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:none!important;padding:5px 0;text-align:right;min-height:0}
  table.cards td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left;font-size:.85rem;flex:none;max-width:55%}
  table.cards td:first-child{font-weight:700;font-size:1.02rem;border-bottom:1px solid var(--line)!important;padding-bottom:7px;margin-bottom:3px;justify-content:flex-start;text-align:left}
  table.cards td:first-child::before{display:none}
  table.cards td[data-label=""]::before{display:none}
  table.cards td:empty{display:none!important}
  table.cards td input.num{max-width:120px}
  .panel.scroll:has(table.cards){overflow:visible;background:none;border:none;box-shadow:none;padding:0}
}
#mnav,#msheet{display:none}
tr.testrow td{background:repeating-linear-gradient(135deg,rgba(128,128,128,.10) 0 6px,rgba(128,128,128,.04) 6px 12px);color:var(--muted)}.testtag{font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
@media(max-width:720px){.stepper #viewMode,.stepper #campFilter,.stepper #teamFilter,.stepper #logoutBtn{display:none!important}}
@media (max-width:720px){
  nav.tabs{display:none!important}
  body.hasDaybar #prevDay,body.hasDaybar #nextDay,body.hasDaybar #datePick,body.hasDaybar #todayBtn,body.hasDaybar #weekLabel{display:none}
  header.top{gap:8px}header.top h1{font-size:1.5rem}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  #hframe{position:absolute;border:1px solid var(--line);border-radius:14px;background:#fff;z-index:30;display:none}@media (max-width:720px){body.hfull header.top,body.hfull nav.tabs,body.hfull #daybar,body.hfull #view{display:none!important}body.hfull #hframe{position:fixed!important;top:0!important;left:0!important;right:0;width:100%!important;height:calc(100vh - 72px - env(safe-area-inset-bottom))!important;height:calc(100dvh - 72px - env(safe-area-inset-bottom))!important;border:0;border-radius:0}}#mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  #mnav button{border:none;background:none;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);min-height:48px}
  #mnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #mnav button[aria-selected=true]{color:var(--accent);background:var(--accent-soft)}
  #msheet.open{display:block;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35)}
  #msheet .sh{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto}
  #msheet .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  #msheet .grid button{padding:14px 12px;text-align:left;font-weight:600;border-radius:12px}
  #msheet .grid button[aria-selected=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
nav.tabs button{border:none;background:none;border-radius:0;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.92rem}
.notice.warn{background:transparent;border:1px solid var(--warn);color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.bar h2{font-family:var(--display);font-weight:700;font-size:1.45rem;text-transform:uppercase;letter-spacing:.03em;margin:0}
.bar h3{font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em;margin:0}
.hint{color:var(--muted);font-size:.88rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
td.name{font-weight:600}
input.num{width:76px;text-align:right;font:inherit;font-variant-numeric:tabular-nums;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
input.num.money{width:92px}
input.num.dirty{border-color:var(--warn);background:var(--panel)}
td.derived{color:var(--muted)}
.saved{color:var(--ok);font-size:.85rem}
.zone{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.zone::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mc)}
.m-red{--mc:var(--m-red)} .m-silver{--mc:var(--m-silver)} .m-gold{--mc:var(--m-gold)} .m-plat{--mc:var(--m-plat)} .m-dia{--mc:var(--m-dia)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tile .big{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1}
.tile .of{color:var(--muted);font-size:.86rem}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog.hit > i{background:var(--ok)}
.mprog{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.mprog .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mprog .amt{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1}
.mbar{position:relative;height:18px;border-radius:9px;background:var(--line);overflow:visible}
.mbar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),#c0394f);transition:width .6s ease}
.mbar.ahead>i{background:linear-gradient(90deg,#1f8a4c,#3cc47a)}
.mbar.on>i{background:linear-gradient(90deg,#b8860b,#e0a526)}
.mbar.behind>i{background:linear-gradient(90deg,#a3121f,#e0343f)}
.mbar>b{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--ink);opacity:.75}
.mstat{font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.mstat.ahead{background:#dff3e7;color:#17663a}.mstat.on{background:#fbf0d6;color:#8a6100}.mstat.behind{background:#fde3e4;color:#a3121f}
.streaks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.streak{padding:12px 14px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:2px}
.streak .n{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.badge.got{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cashwarn{color:#8a6100;font-weight:600;font-size:.86rem}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0}
.ins .panel{padding:14px 16px;min-width:0}
.ins .wide{grid-column:1/-1}
.ins h4{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:center}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;grid-column:1/-1}
.gauges .panel{text-align:center;padding:12px 10px 10px}
.gauges svg{width:100%;max-width:190px;display:block;margin:0 auto}
.gauges .gsub{font-size:.75rem;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.82rem;justify-content:center}
.legend span{display:flex;align-items:center;gap:8px}.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none}
.donutwrap{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.donutwrap svg{width:170px;height:170px;flex:none}
.funnel .fr{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.funnel .fr:first-child{border-top:none}
.funnel .fl b{display:block}.funnel .fl span{font-size:.78rem;color:var(--muted);display:block}
.funnel .fb{position:relative;height:38px}
.funnel .fb i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent);opacity:.9}
.funnel .fb em{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.75rem;font-weight:700;background:rgba(0,0,0,.72);color:#fff;padding:2px 8px;border-radius:999px}
.trend svg{width:100%;display:block}
.trend .keys{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-bottom:4px}
.trend .keys b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.hslot{padding:12px 14px}
.hslot.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.hslot .hh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hslot .hh b{font-size:1.05rem}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.hf{display:flex;flex-direction:column;gap:4px}
.hf label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hstep{display:grid;grid-template-columns:44px 1fr 44px;gap:4px}
.hstep button{min-height:44px;font-size:1.3rem;font-weight:700;padding:0}
.hstep input,.hf>input{text-align:center;font-weight:700;font-size:1.1rem;min-height:44px;width:100%}
.hsum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem}
.hsum b{font-weight:700}
.hmini{font-size:.75rem;color:var(--muted);display:block;line-height:1.25}
.hourlybtn{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:10px;padding:9px 14px;text-decoration:none;min-height:44px}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0}
.rate{padding:12px 16px;border-right:1px solid var(--line)}
.rate:last-child{border-right:none}
.rate .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.rate .v{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.1}
.rate .f{font-size:.76rem;color:var(--muted)}
.chartbox{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
svg text{fill:var(--muted);font-family:var(--body);font-size:12px}
svg .val{fill:var(--ink);font-weight:600}
.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty strong{color:var(--ink);font-size:1.05rem}
.teamlist{display:flex;flex-direction:column}
.teamrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.teamrow:last-child{border-bottom:none}
.teamrow input[type=text]{flex:1;min-width:140px;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.teamrow label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem}
.teamrow.off input[type=text]{color:var(--muted);text-decoration:line-through}
.field{display:flex;flex-direction:column;gap:4px;padding:14px}
.field label{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.field input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:360px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:16px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.form input.num{width:100%;font-size:1.15rem;padding:10px 12px;text-align:left}
.formfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.9rem}
.chips b{font-variant-numeric:tabular-nums}
.pbtag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pb);border:1px solid var(--pb);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.join{max-width:460px;margin:20px auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.join h2{font-family:var(--display);font-weight:700;font-size:1.6rem;text-transform:uppercase;margin:0}
.join input{font:inherit;font-size:1.05rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.copybox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
.stack{display:flex;flex-direction:column;gap:14px}
.achieved{color:var(--ok);font-weight:600}
.small{font-size:.78rem;margin-top:2px}
.notice.win{background:transparent;border:1px solid var(--ok)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.linkbtn{border:none;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left}
tr.sel td{background:var(--accent-soft)}
.addgoal{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.addgoal input{flex:1;min-width:200px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gcard{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard.done{border-color:var(--ok)}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gtitle{font:inherit;font-weight:600;font-size:1.05rem;padding:6px 8px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);width:100%}
.gtitle:hover,.gtitle:focus{border-color:var(--line);background:var(--bg)}
.gcard textarea{font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);resize:vertical;width:100%}
.checklist{display:flex;flex-direction:column;gap:4px}
.citem{display:flex;align-items:center;gap:8px;font-size:.92rem}
.citem label{flex:1;min-width:0}
.citem.on label{text-decoration:line-through;color:var(--muted)}
.citem .x{padding:2px 8px;border:none;background:none;color:var(--muted)}
.cadd{font:inherit;font-size:.9rem;padding:6px 8px;border:1px dashed var(--line);border-radius:7px;background:transparent;color:var(--ink)}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.gap{font-variant-numeric:tabular-nums;color:var(--bad);font-weight:600;font-size:.9rem}
.flag{display:inline-block;font-size:.8rem;border:1px solid var(--bad);color:var(--bad);border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0}
td.wrapcell{white-space:normal;text-align:left;min-width:180px}
table.topics td:not(:first-child),table.topics th:not(:first-child){text-align:center}
.blist{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:none}
.brow .prog{grid-column:1/-1}
.bside{display:flex;gap:10px;align-items:center}
.reward{font-weight:600}

<base target="_top">
<div id="login" hidden>
  <div class="lgbox">
    <img id="lgLogo" alt="" hidden>
    <h1 id="lgName">Midas KPIs</h1>
    <div class="lgtabs" role="tablist">
      <button id="lgTabIn" class="on" type="button">Log in</button>
      <button id="lgTabNew" type="button">Create my login</button>
    </div>
    <form id="lgIn">
      <label for="lgUser">Your name</label>
      <input id="lgUser" type="text" autocomplete="username" placeholder="First and last name">
      <label for="lgPin">PIN</label>
      <input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4 to 8 digits">
      <button class="primary" type="submit">Log in</button>
      <p class="lghint">Forgot your PIN? Ask Midas admin to reset it.</p>
    </form>
    <form id="lgNew" hidden>
      <label for="nwUser">Your name</label>
      <input id="nwUser" type="text" placeholder="First and last name">
      <label for="nwPin">Choose a PIN</label>
      <input id="nwPin" type="password" inputmode="numeric" placeholder="4 to 8 digits">

      <select id="nwTeam" hidden></select>
      <button class="primary" type="submit">Create my login</button>
      <p class="lghint">Only you and your leaders see your detail. Your weekly totals go on the shared leaderboard.</p>
    </form>
    <p id="lgMsg" class="lgmsg" role="alert"></p>
  </div>
</div>
<style>
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(40px,env(safe-area-inset-top)) 16px 40px}

</style>
<script>
/* Midas KPIs on Google: a small database client that talks to Code.gs and
   looks like the claude.use("db") / claude.use("user") API the app is written against. */
(function(){
  window.KAIZEN_GOOGLE=true;
  const TOK='kaizen_token';
  const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
  function call(fn,...args){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...args)})}
  let session=null;let sessionReady;const ready=new Promise(r=>sessionReady=r);
  const store={};const listeners=new Set();let since=0;let syncing=false;let pending=false;
  /* ---- local store + live queries ---- */
  function snapDoc(path){const d=store[path];return{id:path.split('/').pop(),exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}}
  function childDocs(path){const n=path.split('/').length+1;return Object.keys(store).filter(k=>k.startsWith(path+'/')&&k.split('/').length===n)}
  function runQuery(path,f,ob,lim){let ks=childDocs(path);
    let docs=ks.map(snapDoc).filter(d=>f.every(([fld,op,v])=>{const x=d.data()[fld];
      return op==='=='?x===v:op==='!='?x!==v:op==='<'?x<v:op==='<='?x<=v:op==='>'?x>v:op==='>='?x>=v:op==='in'?(v||[]).includes(x):op==='not-in'?!(v||[]).includes(x):op==='array-contains'?Array.isArray(x)&&x.includes(v):true}));
    if(ob){const [fld,dir]=ob;docs.sort((a,b)=>{const x=a.data()[fld],y=b.data()[fld];if(x===y)return 0;if(x==null)return 1;if(y==null)return -1;return(x<y?-1:1)*(dir==='desc'?-1:1)})}
    else docs.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
    if(lim)docs=docs.slice(0,lim);
    return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}}
  function notify(){listeners.forEach(l=>l.run())}
  function addListener(compute,fn){const l={last:null,run(){let r;try{r=compute()}catch(e){return}const sig=JSON.stringify(r.docs?r.docs.map(d=>[d.id,d.data()]):[r.exists,r.data()]);if(sig===l.last)return;l.last=sig;try{fn(r)}catch(e){console.error(e)}}};
    listeners.add(l);ready.then(()=>setTimeout(()=>l.run(),0));return()=>listeners.delete(l)}
  function merge(a,b){const o={...(a||{})};for(const k in b){const v=b[k];o[k]=v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])?merge(o[k],v):v}return o}
  function applyDocs(docs){(docs||[]).forEach(x=>{if(x.del)delete store[x.p];else store[x.p]=x.d})}
  /* ---- sync with the sheet ---- */
  async function sync(full){if(!session)return;if(syncing){pending=true;return}syncing=true;
    try{const r=await call('sync',session.token,full?0:Math.max(0,since-3000));
      if(r.full){Object.keys(store).forEach(k=>delete store[k])}
      applyDocs(r.docs);since=r.now;reapply();if(outbox.length)flush();
      if(r.me&&(r.me.role!==session.role)){session.role=r.me.role;ls.set(TOK,JSON.stringify(session));location.reload();return}
      notify()}
    catch(e){if(String(e&&e.message||e).includes('AUTH')){logoutLocal();return}}
    finally{syncing=false;if(pending){pending=false;setTimeout(()=>sync(false),200)}}}
  let timer=null;function startPolling(){clearInterval(timer);timer=setInterval(()=>{if(document.visibilityState==='visible')sync(false)},40000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync(false)});setInterval(()=>sync(true),10*60000)}
  /* ---- offline outbox: writes made with no signal are kept on the phone and sent when it's back ---- */
  const OBK=()=>'kaizen_outbox_'+(session&&session.uid||'');let outbox=[];let flushing=false;
  function loadOutbox(){try{outbox=JSON.parse(ls.get(OBK())||'[]')||[]}catch(_){outbox=[]}badge()}
  function saveOutbox(){ls.set(OBK(),JSON.stringify(outbox));badge()}
  function isNet(e){const m=String(e&&e.message||e);return !/AUTH|DENIED|MISSING|BAD_PATH|TOO_LARGE|Only Ameliah|Enter your|PIN/.test(m)}
  function queue(ops){outbox.push(ops);saveOutbox();setTimeout(flush,4000)}
  function reapply(){outbox.forEach(ops=>ops.forEach(o=>{if(o.op==='delete')delete store[o.path];else if(o.op==='update')store[o.path]=merge(store[o.path]||{},o.data);else store[o.path]=JSON.parse(JSON.stringify(o.data))}))}
  function badge(){let b=document.getElementById('syncBadge');if(!b){b=document.createElement('div');b.id='syncBadge';b.setAttribute('role','status');
      b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:80;background:#8a6100;color:#fff;font:600 13px/1.2 system-ui,sans-serif;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer';
      b.onclick=()=>flush();document.body.append(b)}
    const n=outbox.length;b.hidden=!n;b.textContent=n?('No signal \u2014 '+n+' change'+(n>1?'s':'')+' saved on this phone, will send automatically'):''}
  async function flush(){if(flushing||!session||!outbox.length)return;flushing=true;
    try{while(outbox.length){const ops=outbox[0];
        try{const r=await call('write',session.token,ops);outbox.shift();saveOutbox();applyDocs(r.docs)}
        catch(e){if(isNet(e))break;outbox.shift();saveOutbox();const m=String(e&&e.message||e).replace(/^Error: /,'');
          try{const t=document.getElementById('toast');if(t){t.textContent='A change made offline couldn\u2019t be saved: '+m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),5000)}}catch(_){}}}
      reapply();notify()}
    finally{flushing=false;if(outbox.length)setTimeout(flush,30000)}}
  window.addEventListener('online',()=>setTimeout(flush,1500));
  async function doWrite(ops){
    const backup={};ops.forEach(o=>backup[o.path]=store[o.path]);
    ops.forEach(o=>{if(o.op==='delete')delete store[o.path];else if(o.op==='update'){if(!store[o.path])throw{code:'invalid_argument',message:'Document does not exist'};store[o.path]=merge(store[o.path],o.data)}else store[o.path]=JSON.parse(JSON.stringify(o.data))});
    notify();
    if(outbox.length){queue(ops);return}
    try{const r=await call('write',session.token,ops);applyDocs(r.docs);notify()}
    catch(e){if(isNet(e)){queue(ops);return}Object.keys(backup).forEach(p=>{if(backup[p]===undefined)delete store[p];else store[p]=backup[p]});notify();
      const m=String(e&&e.message||e);if(m.includes('AUTH')){logoutLocal();throw{code:'revoked',message:m}}
      throw{code:m.includes('DENIED')||m.includes('MISSING')||m.includes('BAD_PATH')?'invalid_argument':m.includes('TOO_LARGE')?'quota_exceeded':'unavailable',message:m}}}
  function docRef(path){return{id:path.split('/').pop(),path,
    get:async()=>{await ready;return snapDoc(path)},
    set:async d=>{await ready;return doWrite([{op:'set',path,data:JSON.parse(JSON.stringify(d))}])},
    update:async d=>{await ready;return doWrite([{op:'update',path,data:JSON.parse(JSON.stringify(d))}])},
    delete:async()=>{await ready;return doWrite([{op:'delete',path}])},
    onSnapshot:(fn)=>addListener(()=>snapDoc(path),fn),
    collection:p=>colRef(path+'/'+p)}}
  function colRef(path,f=[],ob=null,lim=0){const self={path,
    where:(fld,op,v)=>colRef(path,f.concat([[fld,op,v]]),ob,lim),orderBy:(fld,dir)=>colRef(path,f,[fld,dir||'asc'],lim),limit:n=>colRef(path,f,ob,n),
    get:async()=>{await ready;return runQuery(path,f,ob,lim)},
    onSnapshot:(fn)=>addListener(()=>runQuery(path,f,ob,lim),fn),
    doc:id=>docRef(path+'/'+(id||('d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))),
    add:async d=>{const r=self.doc();await r.set(d);return r}};return self}
  const db={doc:docRef,collection:p=>colRef(p)};
  const user={id:async()=>{await ready;return session.uid},isOwner:async()=>{await ready;return session.role==='owner'},canEdit:async()=>{await ready;return session.role==='owner'||session.role==='tl'},
    can:async()=>{await ready;return session.role==='owner'},me:async()=>{await ready;return{id:session.uid,name:session.name,isOwner:session.role==='owner',canEdit:session.role!=='rep',email:null,avatarUrl:'',color:'#424965'}},
    profiles:async ids=>{const o={};(Array.isArray(ids)?ids:[ids]).forEach(i=>o[i]={id:i,name:'',avatarUrl:'',color:'#424965',email:null,isMe:i===(session&&session.uid),guest:false});return o},name:async()=>session.name};
  window.claude={use:async n=>{await ready;return n==='db'?db:n==='user'?user:null}};
  window.orexisSupport=m=>call('supportMessage',session.token,m);
  window.kaizenAdmin={list:()=>call('adminAccess',session.token,'list'),act:(a,uid,v)=>call('adminAccess',session.token,a,uid,v)};
  const FD='https://ameliahcrowe-cloud.github.io';function fdPost(m){try{window.top.postMessage(m,FD)}catch(e){}}
  function logoutLocal(){ls.del(TOK);fdPost({kz:'clear'});location.reload()}
  window.kaizenLogout=async()=>{try{if(session)await call('logout',session.token)}catch(e){}logoutLocal()};
  /* ---- login screen ---- */
  async function start(sess){session=sess;ls.set(TOK,JSON.stringify(sess));fdPost({kz:'save',v:JSON.stringify(sess)});loadOutbox();document.getElementById('login').hidden=true;
    await sync(true);sessionReady();startPolling()}
  function showLogin(info){const L=document.getElementById('login');L.hidden=false;const msg=document.getElementById('lgMsg');
    if(info){document.getElementById('lgName').textContent='Midas';if(window.OREXIS_LOGO)info.logo=window.OREXIS_LOGO;if(info.logo){const im=document.getElementById('lgLogo');im.src=info.logo;im.hidden=false}

  document.addEventListener('DOMContentLoaded',()=>{});
  const saved=ls.get(TOK);let sess=null;try{sess=saved?JSON.parse(saved):null}catch(e){}
  function boot(){if(sess&&sess.token){start(sess);return}

})();

<script>
(function(){
const METRICS=[

function kovaEmbeds(){if(!window.KOVA)return;let box=document.getElementById('kovaEmbeds');if(!box){box=document.createElement('div');box.id='kovaEmbeds';document.getElementById('view').after(box)}

  document.getElementById('view').style.display=want?'none':''}

const S={db:null,uid:null,isOwner:false,ready:false,repReady:false,mineReady:false,
  settings:{},reps:{},me:null,allMine:{},weekEntries:{},weekSubs:{},weekSubsFor:null,
  allTeam:{},allTeamReady:false,allTeamLoading:false,teamPbDoc:null,teamPbSent:null,period:'month',summary:null,unsubSummary:null,
  goalsView:'weekly',growth:{},growthSel:null,growthFor:null,growthUnsub:null,growthAllLoaded:false,growthAllLoading:false,confirmDel:null,coach:null,coachSel:null,bonus:null,steps:null,refl:{},rev:{},hrs:{},rDraft:{},reflView:'daily',campaignsCfg:null,campFilter:'all',lastCamp:null,rangeA:null,rangeB:null,topicSel:null,logins:null,loginsLoading:false,reflWho:'team',logo:null,teams:{},board:{},boardPeriod:'week',boardTeam:'all',teamFilter:'all',isAdmin:false,reflSel:null,conf:{},confWeeks:{},promoSel:null,promoCfg:null,
  date:todayStr(),week:null,tab:window.KOVA?'live':'log',drafts:{},goalDrafts:{},chartMetric:'retail',summarySent:{},summaryTimer:null};

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function toStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function todayStr(){return toStr(new Date())}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return toStr(d)}
function weekStart(s){const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return toStr(d)}
function monthKey(s){return s.slice(0,7)}
function niceDate(s,o){return parse(s).toLocaleDateString('en-AU',o||{weekday:'short',day:'numeric',month:'short'})}
function monthName(m){return parse(m+'-01').toLocaleDateString('en-AU',{month:'long',year:'numeric'})}
function num(v){const n=parseFloat(String(v??'').replace(/[$,\s]/g,''));return isFinite(n)?n:0}
function money(n){return '$'+Math.round(n).toLocaleString('en-AU')}
function fmt(m,n){return m.money?money(n):String(Math.round(n*10)/10)}
function fmtK(k,n){const m=METRICS.find(x=>x.k===k);return m?fmt(m,n):(k==='rph'?money(n):String(n))}
function pct(a,b){return b>0?Math.round(a/b*100)+'%':'—'}
const STD_DEFAULT={bell:700,gong:1000,stops:20,conv:75,avg:65,ups:30,rph:120,silver:100,gold:120,platinum:160,diamond:200,buyersDay:12,stopsHr:3,buyersHr:2};
function std(k){const v=Number(((S&&S.std)||{})[k]);return isFinite(v)&&v>0?v:STD_DEFAULT[k]}
function isAdminUser(){return S.isOwner&&S.uid==='u_owner'}
function zone(rph){if(rph==null||!isFinite(rph))return null;
  if(rph<std('silver'))return['Red','m-red'];if(rph<std('gold'))return['Silver','m-silver'];
  if(rph<std('platinum'))return['Gold','m-gold'];if(rph<std('diamond'))return['Platinum','m-plat'];return['Diamond','m-dia']}
function h(tag,attrs,...kids){const el=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='text')el.textContent=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='style')el.style.cssText=v;else el.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}
  return el}
function zoneEl(rph){const z=zone(rph);return z?h('span',{class:'zone '+z[1],text:z[0]}):h('span',{class:'hint',text:'—'})}
let toastT;function toast(msg,ms){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||2400)}
function status(msg,cls){const s=document.getElementById('status');if(!msg){s.hidden=true;return}s.className='notice'+(cls?' '+cls:'');s.textContent=msg;s.hidden=false}
function blank(){const o={};for(const f of LOGFIELDS)o[f.k]=0;return o}
function sumInto(acc,e){for(const f of LOGFIELDS)acc[f.k]=(acc[f.k]||0)+num(e[f.k]);return acc}
function leadRole(){return S.isOwner||S.isAdmin}
function leader(){return leadRole()&&!S.viewMe}
function repList(activeOnly){let l=repListAll(activeOnly);const f=S.teamFilter;
  if(leader()&&isAdminUser()&&!S.admin){const mine={[S.uid]:1};downOf(S.uid).forEach(r=>mine[r.id]=1);return l.filter(r=>mine[r.id])}
  if(leader()&&f&&f!=='all')l=l.filter(r=>f==='none'?!r.team:(r.team===f||(f===S.uid&&r.id===S.uid)));return l}
function repListAll(activeOnly,incTest){return Object.entries(S.reps).map(([id,r])=>({id,...r}))
  .filter(r=>(!activeOnly||r.active!==false)).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name)))}
function repName(id){const r=S.reps[id];return (r&&r.name)||'Team member'}
function goalOf(id,week){const r=S.reps[id];return (r&&r.goals&&r.goals[week])||null}
async function write(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e&&e.code==='invalid_argument')status('Your change wasn’t saved because your access only lets you view this tracker. Ask your team leader to share it with you so you can edit.','warn');
    else if(e&&e.code==='quota_exceeded')status('The tracker is full. Ask your team leader to clear out old data.','warn');
    else toast('Could not save. Check your connection and try again.');
    return false}}

/* ---------- entries ---------- */
function rawSource(uid,kind){
  if(uid===S.uid&&S.mineReady)return Object.values(S.allMine);
  if(kind==='period')return Object.values(Object.assign({},S.allTeam[uid]||{},S.weekEntries[uid]||{}));
  return Object.values(S.weekEntries[uid]||{})}
/* confirmed figures (leader-entered) replace the rep's own numbers for that day */
function sourceAll(uid,kind){const list=rawSource(uid,kind);const c=S.conf[uid];if(!c)return list;
  const m={};list.forEach(e=>m[e.date]=e);for(const d in c){if(c[d])m[d]={...c[d],confirmed:true,self:m[d]||null}}return Object.values(m)}
/* campaigns: every day is tagged with one; the header filter narrows every view */
function campaigns(){let l=(S.campaignsCfg&&S.campaignsCfg.list)||[];if(!l.length)l=[{id:'paralympics',name:'Paralympics',active:true}];if(!l.some(c=>/wound/i.test(c.name||c.id)))l=l.concat([{id:'wounded',name:'Wounded Heroes',active:true}]);const seen={};return l.filter(c=>{const k=String(c.name||c.id).trim().toLowerCase();if(seen[k])return false;seen[k]=1;return true})}
function campStep(id){const c=campaigns().find(x=>x.id===id);const n=String((c&&c.name)||id||'');return /wound/i.test(n)?30:/paraly/i.test(n)?25:0}
function defCampaign(){const c=S.campaignsCfg||{};const l=campaigns();return(c.def&&l.some(x=>x.id===c.def))?c.def:l[0].id}
function campName(id){const c=campaigns().find(x=>x.id===id);return c?c.name:'Other'}
function campOf(e){return(e&&e.campaign)||defCampaign()}
function source(uid,kind){const l=sourceAll(uid,kind);const f=S.campFilter;return f&&f!=='all'?l.filter(e=>campOf(e)===f):l}
function rawEntry(uid,date){return rawSource(uid,'date').find(e=>e.date===date)||null}
function confEntry(uid,date){return(S.conf[uid]||{})[date]||null}
function confirmMode(uid){return leader()&&uid!==S.uid}
function weekAll(uid,wk){const t=blank();sourceAll(uid,'period').filter(e=>e.week===(wk||S.week)).forEach(e=>sumInto(t,e));return t}
function entriesIn(uid,a,b){return source(uid,'period').filter(e=>e.date>=a&&e.date<=b)}
function totalsIn(uids,a,b){const t=blank();uids.forEach(u=>entriesIn(u,a,b).forEach(e=>sumInto(t,e)));return t}
function spanGroup(a,b){const days=(parse(b)-parse(a))/864e5;return days<=14?'day':days<=100?'week':days<=800?'month':'year'}
function periodRange(){const d=parse(S.date),y=d.getFullYear(),m=d.getMonth();
  if(S.period==='day')return{a:S.date,b:S.date,label:niceDate(S.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'}),group:'none'};
  if(S.period==='week')return{a:S.week,b:addDays(S.week,6),label:'Week of '+niceDate(S.week,{day:'numeric',month:'long',year:'numeric'}),group:'day'};
  if(S.period==='all'){let first=todayStr();scopeIds().forEach(u=>source(u,'period').forEach(e=>{if(e.date<first)first=e.date}));return{a:first,b:todayStr(),label:'All time',group:spanGroup(first,todayStr())==='year'?'year':'month',noNav:true}}
  if(S.period==='range'){let a=S.rangeA||addDays(todayStr(),-27),b=S.rangeB||todayStr();if(a>b)[a,b]=[b,a];return{a,b,label:niceDate(a,{day:'numeric',month:'short',year:'numeric'})+' – '+niceDate(b,{day:'numeric',month:'short',year:'numeric'}),group:spanGroup(a,b),noNav:true,range:true}}
  if(S.period==='quarter'){const q=Math.floor(m/3);return{a:toStr(new Date(y,q*3,1)),b:toStr(new Date(y,q*3+3,0)),label:`Q${q+1} ${y}`,group:'month'}}
  if(S.period==='ytd'||S.period==='year'){const ty=new Date().getFullYear();return{a:y+'-01-01',b:y===ty?todayStr():y+'-12-31',label:y===ty?`Year to date ${y}`:`${y} full year`,group:'month'}}
  return{a:toStr(new Date(y,m,1)),b:toStr(new Date(y,m+1,0)),label:monthName(monthKey(S.date)),group:'week'}}
function shiftPeriod(n){const d=parse(S.date);
  if(S.period==='day'){setDate(addDays(S.date,n));return}if(S.period==='week'){setDate(addDays(S.date,7*n));return}
  if(S.period==='quarter')d.setMonth(d.getMonth()+3*n,1);else if(S.period==='ytd'||S.period==='year')d.setFullYear(d.getFullYear()+n,0,1);else d.setMonth(d.getMonth()+n,1);setDate(toStr(d))}
function entriesFor(uid,kind,key){return source(uid,kind).filter(e=>e[kind]===key)}
function savedEntry(uid,date){return confirmMode(uid)?(confEntry(uid,date)||rawEntry(uid,date)):rawEntry(uid,date)}
function draftKey(uid,date){return uid+'|'+date}
function rowVals(uid,date){const saved=savedEntry(uid,date)||{};const d=S.drafts[draftKey(uid,date)]||{};const o={};
  for(const f of LOGFIELDS)o[f.k]=(f.k in d)?num(d[f.k]):num(saved[f.k]);return o}
function totalsFor(uids,kind,key){const t=blank();uids.forEach(u=>entriesFor(u,kind,key).forEach(e=>sumInto(t,e)));return t}
function daysFor(uids){const days=DAYS.map(()=>blank());uids.forEach(u=>entriesFor(u,'week',S.week).forEach(e=>{
  const i=Math.round((parse(e.date)-parse(S.week))/864e5);if(i>=0&&i<7)sumInto(days[i],e)}));return days}
function goalTotal(uids,week){const g={};METRICS.forEach(m=>g[m.k]=0);let any=false;
  uids.forEach(u=>{const x=goalOf(u,week);if(x){any=true;METRICS.forEach(m=>g[m.k]+=num(x[m.k]))}});return any?g:null}
function scopeIds(){return leader()?repList(false).filter(r=>!r.test).map(r=>r.id):(S.me?[S.uid]:[])}
function isTest(id){return !!(S.reps[id]||{}).test}

/* ---------- personal bests ---------- */
function computePB(list){const day={},week={},month={},weeks={},months={};
  for(const e of list){
    for(const [k] of PB_DAY){const v=k==='rph'?(num(e.hours)>=1?num(e.retail)/num(e.hours):0):num(e[k]);
      if(v>0&&(!day[k]||v>day[k].v))day[k]={v:Math.round(v*100)/100,date:e.date}}
    sumInto(weeks[e.week]=weeks[e.week]||blank(),e);const mk=monthKey(e.date);sumInto(months[mk]=months[mk]||blank(),e)}
  const best=(map,out,key)=>{for(const w in map){const x=map[w];for(const [k] of PB_WEEK){const v=x[k];if(v>0&&(!out[k]||v>out[k].v))out[k]={v,[key]:w}}
    if(x.hours>=1){const r=Math.round(x.retail/x.hours*100)/100;if(!out.rph||r>out.rph.v)out.rph={v:r,[key]:w}}}};
  best(weeks,week,'week');best(months,month,'month');
  return{day,week,month}}
function newRecords(oldPb,pb){const out=[];oldPb=oldPb||{day:{},week:{}};
  for(const [k,l] of PB_DAY){const a=pb.day[k],b=(oldPb.day||{})[k];if(a&&(!b||a.v>b.v)&&b)out.push(`${l} ${fmtK(k,a.v)} (best day)`)}
  for(const [k,l] of PB_WEEK){const a=pb.week[k],b=(oldPb.week||{})[k];if(a&&(!b||a.v>b.v)&&b)out.push(`${l} ${fmtK(k,a.v)} (best week)`)}
  return out}
async function recalcAllPB(){if(S.pbBusy)return;S.pbBusy=true;render();const ids=[...new Set([S.uid].concat(repList(false).map(r=>r.id)))].filter(Boolean);
  for(const id of ids){try{await refreshPB(id,true)}catch(_){}}S.pbBusy=false;toast('PBs recalculated for '+ids.length+' '+(ids.length===1?'person':'people'));render();scheduleTeamPB()}
async function refreshPB(uid,quiet){
  let list;
  if(uid===S.uid&&S.mineReady)list=sourceAll(uid,'period');
  else{try{const [a,b]=await Promise.all([S.db.collection('reps/'+uid+'/entries').limit(1000).get(),S.db.collection('conf/'+uid+'/days').limit(1000).get()]);
    const m={};a.docs.forEach(d=>m[d.id]=d.data());b.docs.forEach(d=>m[d.id]=d.data());list=Object.values(m)}catch(e){return}}
  const rep=S.reps[uid]||{};const pb=computePB(list);
  if(JSON.stringify(pb)===JSON.stringify(rep.pb||null))return;
  const recs=newRecords(rep.pb,pb);
  const ok=await write(()=>S.db.doc('reps/'+uid).update({pb}));
  if(ok){if(S.reps[uid])S.reps[uid]={...S.reps[uid],pb};if(uid===S.uid&&S.me)S.me={...S.me,pb};if(recs.length&&!quiet)toast('New PB! '+recs.join(' · '),4000)}}

/* ---------- header & tabs ---------- */
const PAIRS=[['week','totals','📅 This week','📆 Month & range'],['promo','bonus','🎖️ Promotion','💰 Bonus'],['board','line','🏆 Retail','📏 Above the line'],['pbs','pbboard','⭐ Mine','🏅 Team records']];
const PAIR_OF={totals:'week',bonus:'promo',line:'board',pbboard:'pbs'};
function navTabs(){const T=tabs();const has=k=>T.some(t=>t[0]===k);return T.filter(([k])=>!(PAIR_OF[k]&&has(PAIR_OF[k])))}
function pairSwitch(){if(S.admin&&S.tab==='admin')return null;const T=tabs();const has=k=>T.some(t=>t[0]===k);const P=PAIRS.find(p=>p[0]===S.tab||p[1]===S.tab);if(!P||!has(P[0])||!has(P[1]))return null;
  return h('div',{class:'seg',style:'margin-bottom:8px'},[[P[0],P[2]],[P[1],P[3]]].map(([k,l])=>h('button',{class:S.tab===k?'primary':null,'aria-pressed':String(S.tab===k),onclick:()=>go(k)},l)))}
function tabs(){if(S.admin&&isAdminUser())return [['admin','⚙️ Admin']].concat(LEADER_TABS);return leader()?LEADER_TABS.filter(([k])=>k!=='pbboard'||S.isOwner):(leadRole()?REP_TABS.slice(0,2).concat([['board','Leaderboard']],REP_TABS.slice(2)):REP_TABS)}
function renderHeader(){
  const lg=document.getElementById('teamLogo');const src=window.OREXIS_LOGO||(S.logo&&S.logo.data);if(src&&String(src).startsWith('data:image/')){if(lg.getAttribute('src')!==src)lg.src=src;lg.hidden=false}else lg.hidden=true;

function chart(days,m){

  s.setAttribute('viewBox',`0 0 ${W} ${H}`);s.setAttribute('width','100%');s.setAttribute('role','img');s.setAttribute('aria-label',`${m.l} by day this week`);
  const el=(t,a,txt)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(txt!=null)n.textContent=txt;s.append(n);return n};
  for(let i=0;i<=4;i++){const val=top*i/4;const y=pt+ih-ih*i/4;el('line',{x1:pl,x2:W-pr,y1:y,y2:y,stroke:'var(--line)','stroke-width':1});
    el('text',{x:pl-8,y:y+4,'text-anchor':'end'},m.money?money(val):Math.round(val))}
  days.forEach((d,i)=>{const val=d[m.k];const bh=top>0?ih*val/top:0;const x=pl+i*bw+bw*0.18;const w=bw*0.64;
    el('rect',{x,y:pt+ih-bh,width:w,height:Math.max(bh,0),rx:4,fill:'var(--accent)'});
    if(val>0)el('text',{x:x+w/2,y:pt+ih-bh-6,'text-anchor':'middle',class:'val'},fmt(m,val));
    el('text',{x:x+w/2,y:H-10,'text-anchor':'middle'},DAYS[i]+' '+parse(addDays(S.week,i)).getDate())});
  return s}

async function saveGoals(){const ks=Object.keys(S.goalDrafts).filter(k=>k.endsWith('|'+S.week));let n=0;
  for(const k of ks){const uid=k.split('|')[0];const prev=goalOf(uid,S.week)||{};const d=S.goalDrafts[k];const g={};
    for(const m of GMETRICS)g[m.k]=(m.k in d)?num(d[m.k]):num(prev[m.k]);
    const ok=await write(()=>S.db.doc('reps/'+uid).update({goals:{[S.week]:g}}));
    if(ok){const r=S.reps[uid]||{};S.reps[uid]={...r,goals:{...(r.goals||{}),[S.week]:g}};if(uid===S.uid)S.me=S.reps[uid];delete S.goalDrafts[k];n++}}

function copyLastWeek(){const prev=addDays(S.week,-7);let n=0;const ros=leader()?repList(true):[{id:S.uid}];

const GCATS=[['personal','Personal'],['development','Professional development'],['learning','Learning']];
const GTERMS=[['1w','1 week',7],['2w','2 weeks',14],['1m','1 month',30],['6w','6 weeks',42],['8w','8 weeks',56],['2m','2 months',61],['3m','3 months',91],['6m','6 months',182],['12m','12 months',365],['24m','24 months',730]];
const GTERMS_OLD={short:['Short term · 4–8 weeks',56],mid:['Mid term · 1–3 months',91],long:['Long term · 6–24 months',730]};
function termDays(k){const t=GTERMS.find(x=>x[0]===k);return t?t[2]:(GTERMS_OLD[k]?GTERMS_OLD[k][1]:30)}
function termOpts(k){const o=GTERMS.map(([v,l])=>[v,l]);if(GTERMS_OLD[k])o.unshift([k,GTERMS_OLD[k][0]]);return o}
function dueDate(g){const start=(g.startedAt||g.createdAt||'').slice(0,10)||todayStr();return addDays(start,termDays(g.term))}
function growthOf(uid){return Object.entries(S.growth[uid]||{}).map(([id,g])=>({id,...g})).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))}
function subscribeGrowth(uid){if(!uid||uid===S.uid||S.growthFor===uid)return;
  if(S.growthUnsub)try{S.growthUnsub()}catch(_){}S.growthFor=uid;
  S.growthUnsub=S.db.collection('reps/'+uid+'/growth').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.growth[uid]=o;render()},onErr)}
async function loadGrowthAll(force){if(!leader()||S.growthAllLoading||(S.growthAllLoaded&&!force))return;S.growthAllLoading=true;
  await Promise.all(repList(false).map(async r=>{if(r.id===S.uid)return;try{const snap=await S.db.collection('reps/'+r.id+'/growth').get();const o={};snap.docs.forEach(d=>o[d.id]=d.data());if(r.id!==S.growthFor)S.growth[r.id]=o}catch(_){}}));
  S.growthAllLoaded=true;S.growthAllLoading=false;render()}
function growthTarget(){if(!leader())return S.uid;const ros=repList(true);
  if(S.growthSel&&(S.reps[S.growthSel]))return S.growthSel;return (ros[0]&&ros[0].id)||null}
async function addGrowth(uid,preset){const cat=preset?preset.category:document.getElementById('gNewCat').value;const term=preset?preset.term:document.getElementById('gNewTerm').value;
  const title=preset?preset.title:(document.getElementById('gNewTitle').value||'').trim();if(!title){toast('Write the goal first');return}
  const body={category:cat,term,title,why:'',actions:(preset&&preset.actions)||[],achieved:false,createdAt:new Date().toISOString()};
  const ref=S.db.collection('reps/'+uid+'/growth').doc();

async function updGrowth(uid,id,patch){const cur=(S.growth[uid]||{})[id];if(!cur)return;S.growth[uid][id]={...cur,...patch};render();

 rep:[['The 10 pillars',['1. Circle of influence: focus on what you can control','2. Constructive language: your words shape your state','3. Be solution oriented: don’t complain, find a fix','4. Run your own race: compare yourself to yesterday','5. Set clear goals: always bigger than your challenges','6. Review and reset: track daily actions, reset, go again','7. Be your own cheerleader: speak to yourself kindly','8. Buoyant network: you’re the average of your 5','9. Rapid bounce-back: the gap between best and worst should be small','10. Practice gratitude: 3 things every morning']]],
 keys:['Weather, foot traffic and the site are outside your control. Stops, energy and effort are inside it.','Run your own race, critical for new reps next to Platinum performers.','Losing your attitude is normal. The skill is catching it fast.','Review and reset ties directly to hourly KPI reviews.'],
 ana:[['Peak-hour traffic','You can’t control the traffic, only your driving, music and mood.'],['Dropped mark','The best players are back in the next contest within seconds.'],['The car on road trip','The five people around you are literally in the car.']],
 lines:['Control builds confidence. Worry builds fear.','Someone out there would trade their best day for your worst.','Attitude is a circumstance of choice, not chance.'],
 run:['Ask: "What’s ruined your attitude on a shift?" Sort answers inside/outside the circle.','Split the pillars across pairs, each explains theirs with a real example.','Share your own bounce-back story.','Each rep picks one pillar to focus on this week.'],
 watch:['Pillars turning into slogans. Push for real examples.','Toxic positivity. The goal is recovery, not never dipping.'],
 check:['Name one thing on shift that’s outside your circle.','What’s your reset routine after a losing hour?']},
{id:'stopping',t:'Coaching Stopping',p:14,dia:'distance',one:'The stop IS the sale. Every person you don’t approach is a guaranteed no.',
 rep:[['SEEC',['Smile: your expression lands before your words','Eye contact: hold it from 6m','Enthusiasm: if you’re flat, they’ll be flat','Conviction: own the space, you’re not interrupting']],['Distance Theory',['6m: "Hey!" "G’day" "Hello" — slows their pace','4m: "Just a once off!" — pre-handles the biggest silent objection','2m: "For the Paralympics!" — let the cause land']],['Mindset',['Law of Averages: at 1 in 4, every 3 no’s means a yes is coming','A.C.E.: Attitude, Consistency, Exposure']]],
 keys:['Timing matters as much as the words.','Reps who feel they’re interrupting stop fewer people.','LOA and ACE keep stopping consistent through quiet hours.'],
 ana:[['Fishing','Cast wide and cast early.'],['The busker','A confident busker draws a crowd with the same song.'],['The maths','40 stops at 1 in 4 is 10 sales. 20 stops is 5.']],
 lines:['Every no gets you closer to the next yes.','You’re not interrupting them. You’re giving them a chance.'],
 run:['Mark 6m, 4m and 2m on the floor.','Walk past as a customer while reps deliver each line at the right distance.','Eye-contact drill from 6m, partner calls when it breaks.','Do the Law of Averages maths live with the group’s numbers.'],
 watch:['Starting at 1m when they’re already past.','Easing off when it’s quiet.','Volume is not pressure. Never block or chase, respect a clear no.'],
 check:['What do you say at 4m, and why?','If you convert 1 in 4, how many no’s come before a yes?']},
{id:'kpis',t:'Key Performance Indicators',p:15,dia:'kpi',one:'Four numbers tell you exactly what to work on. Know your band, and know the lever that moves it.',
 rep:[['Levers behind each number',['Stops: SEEC, Distance Theory, confidence, ACE, work ethic','Stop to buyer %: tone/tempo/pausing, rapport, FAQs, clear-concise-confident, belief, landing impulses','Upsell %: clear-concise-confident, mentality, assumptiveness, systems (anchoring, two up one down)','Sale avg: pitching big, value on self, landing impulses, belief, strong goals, assumptiveness']]],
 keys:['Make sure reps can tell stops per hour and stop to buyer % apart.','KPIs are diagnostic: each number points to a lever.','RPH is the result. The levers are what reps work on.','Red Zone is the starting line, not a verdict.'],
 ana:[['Car dashboard','One warning light tells the mechanic where to look.'],['The doctor','The KPI is the symptom, the lever is the treatment.'],['Worked example','3.6 stops/hr at 65% stop to buyer: no stopping problem. Fix tone, rapport and FAQs.']],
 lines:['Don’t fix everything. Find the one number holding you back.','Red Zone is a starting point, not a verdict.'],
 run:['Walk through each KPI on the KPI sheet.','Give two made-up rep profiles; group diagnoses the weakest KPI and lever.','Link each lever to its page.','Each rep writes the first KPI they’ll target this week.'],
 watch:['Fixating on RPH instead of levers.','New reps feeling judged by the Rookie tier. Frame it as a pathway.'],
 check:['Your upsell is at 12%. Which levers do you work on?','Difference between stops per hour and stop to buyer %?']},
{id:'rules13',t:'13 Rules for a Sales Superstar Mindset',p:18,dia:null,one:'Top performers aren’t born. They follow the same habits every day, and these 13 are the blueprint.',
 rep:[['The 13 rules',['1. Stay hungry','2. Never compromise your integrity','3. Stay positive','4. Be authoritative','5. Get prepared','6. Mind your reputation','7. Be genuine','8. Put your best foot forward','9. Set goals','10. Become a service fanatic','11. Remember to listen','12. Keep perspective','13. Develop a thirst for self-improvement']]],
 keys:['Integrity (#2) is non-negotiable. In fundraising, trust is the product. Spend the most time here.','Attitude, not aptitude, determines altitude (#3).','Show up early and know your goal (#5).','The sale begins at yes (#10).','This induction is the start, not the finish (#13).'],
 ana:[['Elite athletes','Talent gets you picked. Habits keep you on the team.'],['Reputation bank','Every interaction is a deposit or a withdrawal.'],['Tell, explain, demonstrate','Recipe card vs cooking class vs watching a chef.']],
 lines:['A salesperson tells, a good salesperson explains, and a sales superstar demonstrates.','You can’t buy a good reputation. You earn it.'],
 run:['Ask: "Best salesperson you’ve bought from? What did they do?" Map to the rules.','Pick 4–5 to go deep on, always including #2.','Discuss what compromising integrity looks like on site.','Each rep picks 3 rules and shares one.'],
 watch:['Rushing through all 13.','"Be authoritative" read as arrogance.'],
 check:['What does compromising integrity look like on site?','Which rule is already your strength?']},
{id:'about',t:'Sales Influences — ABOUT',p:19,dia:'about',one:'Influences move a customer from maybe to yes, but only when they sound natural and are completely true.',
 rep:[['The five levers',['A — Assuredness: certainty of a specialist, most at the open and close','B — Benefits: make the upside big and the cost small','O — Opportunity: give today a real reason','U — Urgency: through action, pace, reaching for the tablet','T — Trends: real numbers and real stories']],['Weaving them in',['Don’t stack them. One where it fits.','Make it invisible. If they can name the technique, it’s lost its power.']]],
 keys:['Features inform, influences move.','Everything must be true. Never invent a deadline, a statistic or a trend.'],
 ana:[['Seasoning','A pinch of each at the right time. Tip in the whole rack and it’s ruined.'],['The busy restaurant','People pick the full one. That’s Trends.'],['Gym ads','They sell how you’ll feel. That’s Benefits.']],
 lines:['The moment it feels like a tactic, the customer feels sold, not helped.','Every trend and every deadline you mention has to be true.'],
 run:['Read a pitch with all five stacked. How did it feel?','Place each letter where it fits: open, pitch or close.','Each rep writes one line per letter in their own words.','Partner test: if they can name the technique, rewrite it.'],
 watch:['Fake urgency or made-up figures (integrity and compliance risk).','Lines that sound memorised.'],
 check:['Which influence fits your close?','What real trend can you use on your site?']},
{id:'tjar',t:'FAQ Handling — T.J.A.R.',p:20,dia:'tjar',one:'An FAQ is a buying sign. The customer is telling you exactly what they need to hear to say yes.',
 rep:[['T.J.A.R.',['Thank: questions are buying signs','Joke: settle them, show confidence','Answer: honestly, without showing all your cards','Re-direct: straight back to where you left off']],['Know word-perfect',['"How much is it?"','"What’s the minimum?"','"Here’s $10."']]],
 keys:['FAQs aren’t objections. Reps who treat them as walls get defensive.','Never dodge price.','If a joke won’t land (a DISC Dominant), smile instead.'],
 ana:[['Shopping','"Does it come in blue?" is closer to buying than walking past.'],['GPS','Take the detour, then recalculate straight back onto the route.'],['Tour guide','A question means they’re interested. Answer and keep walking.']],
 lines:['Every question is a buying signal, not a wall.','Answer it, then get back on track.'],
 run:['Demo T.J.A.R. live on "How much is it?"','Each rep writes responses to the 3 FAQs.','Rapid fire FAQs mid-pitch.','Brainstorm other FAQs from site.'],
 watch:['Getting rattled or defensive.','Over-answering and losing the pitch.','Forgetting the re-direct.'],
 check:['What are the four steps?','Where exactly do you re-direct to?']},
{id:'upsell',t:'Upselling Fundamentals — A.A.A.R.R.',p:21,dia:'aaarr',one:'The upsell isn’t a bigger ask. Anchoring high makes the jump you actually want feel small.',
 rep:[['Worked example: $50 → $150 Silver',['Appreciate: "It might sound corny, but a huge thank you for helping today. Most people just walk past."','Ask: "Is there any chance I can be a little cheeky with you?"','Anchor: "We have a big daily goal of 5 Silver Medals today…"','Re-impulse: "I’m not going to ask you to do a Silver, but I was sitting one Aussie pack off my next Silver…"','Re-close: "Can you make the jump to the Aussie so I can get the next one?"']]],
 keys:['The anchor is not the ask. "I’m not going to ask you to do a Silver" is the key line.','Skipping Appreciate or Ask turns the upsell into a grab.','Re-close, then silence.','A no is fine. Thank them warmly.'],
 ana:[['The jacket rack','A $900 jacket makes $300 feel reasonable.'],['The wine list','Most people pick the second bottle.'],['Asking a mate a favour','Thank them first, check it’s okay to ask.']],
 lines:['Is there any chance I can be a little cheeky with you?','Can you make the jump to the Aussie so I can get the next one?'],
 run:['Demo the full $50 → $150 example as written.','Break down each step and why it sits in that order.','Pairs practise; customer varies yes, no and maybe.','Practise the graceful exit on a no.'],
 watch:['The anchor delivered as a real ask.','Pushing after a clear no. Extra care with anyone who seems vulnerable.'],
 check:['Why mention the Silver if you’re not asking for it?','What do you do when they say no?']},
{id:'compliance',t:'Fundamental Compliance Questions',p:22,dia:null,one:'A mystery shopper asks the same nine questions every time. How you answer is what gets scored.',
 rep:[['The 9 questions',['Government funding? Yes, Paralympics Australia receives some.','All money to PA? No, be upfront that not all goes directly.','Volunteer or paid? Paid collector.','Funds used for? Things like the Winter and Summer Paralympics and kids with disabilities into sport.','Minimum? $25.','Tax-deductible receipt? Proof of purchase, but not tax deductible.','Donate instead? On the website, but we’d love support with this trade promotion.','Friendly, respectful, truthful? Always. Funds "could" or "can", never "will".','Clear overall? Stick to the facts in the script.']],['The golden rule',['"WILL" never funds anything, only "COULD" or "CAN". Always a trade promotion, never a donation.']]],
 keys:['Know these cold.'],ana:[],lines:['"Could" or "can", never "will".'],run:['Run the compliance check in the app with each new starter in week one.'],watch:['"Will" creeping into the pitch.','Calling it a donation.'],check:['What’s the minimum?','Is it tax deductible?']},
{id:'ways8',t:'8 Ways to Improve Your Attitude',p:26,dia:null,one:'Attitude is built by daily habits, not moods. These eight are the habits.',
 rep:[['The 8 ways',['1. Always act with a purpose','2. Take action without expecting results','3. Stretch past your limits every day','4. Say "thank you" more often','5. Turn setbacks into skill','6. Forgive the limits of others','7. Choose your circle carefully','8. Don’t take yourself too seriously']]],
 keys:['Pair with Bulletproof Attitude: those are the mindset, these are the daily actions.','Process over outcome (#2).','A rejection is a signpost to the fix, not a verdict (#5).'],
 ana:[['The archer','Focus on technique and release, not staring at the bullseye.'],['Muscle','Skip the daily stretch and it weakens.'],['Missed turn','A GPS doesn’t get upset. It recalculates.']],
 lines:['Results are signposts, not verdicts.','People relax around someone who can laugh at themselves.'],
 run:['Quick poll: easiest and hardest of the 8.','Share your own setback that became a skill.','Pairs discuss #6.','Finish with the reflection question.'],
 watch:['#7 used to justify cliques. Frame it as protecting your energy.'],
 check:['One setback from this week, and the skill in it?']},
{id:'grasp',t:'Introduction to Sales — GRASP',p:28,dia:'grasp',one:'GRASP is what we look for in every rep. None of it needs experience, so every rep can nail all five from day one.',
 rep:[['GRASP',['G — Goals: daily, weekly and long-term, written on the KPI sheet','R — Reliability: on time, every shift, admin done (timesheet, settlement, SA-SL doc)','A — Attitude: choose it daily, it’s contagious both ways','S — Systems: trust SEEC, Distance Theory, Rapport Framework, T.J.A.R., A.A.A.R.R.','P — Productivity: make every hour count']]],
 keys:['Goals should always be bigger than your challenges.','Trust the proven process before reinventing it.'],
 ana:[['Building a house','Goals the plan, Reliability the foundation, Attitude the builder, Systems the tools, Productivity the build.'],['The new recruit','Zero experience + all five GRASP traits beats talent without them within weeks.']],
 lines:['Experience is optional. GRASP isn’t.','Reliability is how your team learns to trust you.'],
 run:['Write G-R-A-S-P down the whiteboard; group guesses each word.','Fill in each letter together.','Each rep rates themselves 1–10 on each letter.','Preview where each letter shows up later.'],
 watch:['Reliability coming across as a lecture on rules.'],
 check:['Which letter is your strength, and which needs the most work?']},
{id:'mentality',t:'Mentality of a High Performer',p:33,dia:null,one:'Your results won’t outgrow your beliefs. Think bigger, back your effort and expect the yes.',
 rep:[['The 12 beliefs',['1. Think bigger','2. Believe in your ability','3. Think it twice','4. Expect the yes','5. Never pre-judge','6. Mean every word','7. Have intention for your day','8. Be the main character (Gong from 5pm–7pm!)','9. Have a one-more mentality','10. Stay process focused','11. Break the seal','12. Have fun']]],
 keys:['Customers feel your expectation before you speak (#4).','Never pre-judge a person, territory or site (#5).','Intention (#7) links straight to the morning KPI sheet.','"Blissful is satisfaction": being satisfied is when growth stops (#9).'],
 ana:[['The four-minute mile','Impossible until Bannister ran it, then others did within weeks.'],['The customer you misjudged','Share the person you nearly didn’t stop.'],['Main character','The best scene is never the easy part.']],
 lines:['Those who say they can and those who say they can’t are both right.','The fewer words you say, the more impact they have.'],
 run:['Open with your own "impossible" you broke.','Ask: "Who has pre-judged a customer and been wrong?"','Each rep sets an intention for their next shift.','Finish with the reflection box.'],
 watch:['"Manifest" heard as wishful thinking. Tie it to effort and process.'],
 check:['What’s your intention for tomorrow?','One impossible you want to break this month?']},
{id:'disc',t:'DISC Theory',p:34,dia:'disc',one:'Read the person in the first few seconds, then adapt. Same pitch, different delivery.',
 rep:[['The 4 customer types',['D — Dominant: asks questions, rushes you. Answer, ask one back, assertive, elevator pitch.','I — Influential: open and chatty. Just take control.','S — Stable: quiet, hard to read, listening. Match their tone, assume knowledge.','C — Cautious: concerns as questions, needs certainty. Know your stuff, don’t rush, don’t close assumptively.']],['1%ers',['Settle everyone at the start','Nail eye contact','Face matches your words','Listen to understand, not to respond']]],
 keys:['People are blends. Read their style in that moment, don’t label them for life.'],
 ana:[['Explaining your job','Differently to your nan, your best mate and your boss.'],['Buying a car','Some want the test drive now (D). Others want every spec sheet (C).']],
 lines:['Adapt your style, never your integrity.','Listen to understand, not to respond.'],
 run:['Show of hands: which type are you?','Role-play each type while the group identifies it.','Pairs: customer secretly picks a type, rep adapts.','Cover the 1%ers.'],
 watch:['Rigid labelling.','"Stuff up the pitch" taken literally.','Assumptive closes on C types.'],
 check:['What tells you someone is a C?','How do you take control with a D?']},
{id:'roadtrip',t:'10 Points for a Successful Road Trip',p:35,dia:null,one:'Road trips are the fastest growth on offer. The standards you set on day one decide how the whole trip goes.',
 rep:[['The 10 points',['1. Think what’s possible, not probable','2. Operate with purpose','3. Own the mornings','4. Lift your KPIs','5. Be an inflator, not a hater','6. Be considerate','7. Share stories','8. Protect your energy','9. Run your own race','10. Have fun!']]],
 keys:['Road trip targets are higher: successful site $2,250 vs $1,300 in the city.','In a shared house and car, one negative voice changes everyone’s trip.','Sleep, food and hydration are part of the job.'],
 ana:[['Pre-season camp','Teams go away together to get better fast.'],['Phone battery','Don’t run to 0% by Wednesday.']],
 lines:['Think what’s possible, not what’s probable.','Run your own race.'],
 run:['Returning roadies share their best story.','Agree house expectations before you leave.','Each rep writes their #1 goal.','Check in on these midway.'],
 watch:['Burnout in the back half.','Cliques forming in the house.'],
 check:['What’s your #1 goal for this trip?','What’s your plan to protect your energy?']},
{id:'site',t:'How to Lead a Site to Success',p:36,dia:'site',one:'Your job isn’t to have a good day. It’s to make sure they have one and want to come back tomorrow.',
 rep:[['Site key',['City: $1,300 successful · $1,700 offsetting','Road trip: $2,250 successful · $2,750 offsetting']],['The night before',['Message them so they’re excited','Confirm time, location and details','Have a clear game plan; reach out to their mentors']],['Morning of',['Build rapport: why are they here, what drives them (rookie challenge, self-development, competition)','Fill out the KPI sheet in detail; let them choose what you hold them to','1–2 pitch practices each, including stopping']],['During field',['Review KPIs every hour: hype the wins, hold them to bouncing back','Set the temperature','Half-time: they praise their wins, set their own focus, you ask "Would you like any feedback?", then praise + ONE needle-mover']],['After field',['They self-review: 3 wins, 3 focus areas','Praise a lot; give 1–2 focus points only','Admin: review photo in journey chat, Daily Settlement Balance, SA-SL doc, timesheet']]],
 keys:['Certainty removes no-shows.','Make clear whether targets are site or individual; frame below-target days around their own wins.'],
 ana:[['Driving instructor','You coach from the passenger seat. You don’t grab the wheel.'],['Golf lesson','Fix one thing at a time.'],['Thermostat, not thermometer','A leader sets the temperature.']],
 lines:['Would you like any feedback?','One needle-mover beats five corrections.'],
 run:['Role-play the half-time review.','Practise asking permission, then giving one point.','Discuss a below-target site so the rep still leaves excited.','Share night-before message templates.'],
 watch:['Leaders chasing their own numbers.','Too much feedback.','Admin skipped at the end of a long day.'],
 check:['What three things does the night-before message need?','How many feedback points at half-time?']}];

function hist(uid){return sourceAll(uid,'period').filter(e=>num(e.stops)>0||num(e.retail)>0||num(e.hours)>0).sort((a,b)=>a.date.localeCompare(b.date))}
function bestRolling(uid,n){const L=hist(uid);let best=0,sum=0;for(let i=0;i<L.length;i++){sum+=num(L[i].retail);if(i>=n)sum-=num(L[i-n].retail);if(i>=n-1||L.length<n)best=Math.max(best,sum)}return best}
